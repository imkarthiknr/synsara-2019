{% extends "base.html" %}
{% block title %}Organiser login · {{ c.edition.title }}{% endblock %}
{% block content %}
<div class="wrap page narrow">
  <form class="panel form login" method="post" action="/admin/login">
    <h1>Organiser login</h1>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <button class="btn" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
